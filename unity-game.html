<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | GameDeckFoundary</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #231f20;
        }

        #unity-container,
        #unity-canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="roomCodeDisplay" style="
        position: absolute; 
        top: 20px; 
        left: 20px; 
        z-index: 1000; 
        background-color: rgba(0, 0, 0, 0.8); 
        color: #00ff00; 
        padding: 10px 20px; 
        font-family: Arial, sans-serif; 
        font-size: 24px; 
        font-weight: bold; 
        border-radius: 8px; 
        border: 2px solid #00ff00;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    ">
        Room Code: <span id="codeValue">Loading...</span>
    </div>

    <div id="roomCodeDisplay" style="...">
        Room Code: <span id="codeValue">Loading...</span>
    </div>

    <div id="roleDisplay" style="
        position: absolute; 
        top: 20px; 
        right: 20px; /* 👈 核心：把它钉在屏幕右上角 */
        z-index: 1000; 
        background-color: rgba(0, 0, 0, 0.8); 
        color: #ff9900; /* 用亮橙色区分一下，更醒目 */
        padding: 10px 20px; 
        font-family: Arial, sans-serif; 
        font-size: 24px; 
        font-weight: bold; 
        border-radius: 8px; 
        border: 2px solid #ff9900;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    ">
        Role: <span id="roleValue">Loading...</span>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer" style="display: none;">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">GameDeckFoundary</div>
        </div>
    </div>

    <script>
        // 在 Unity 启动前，直接通过 localStorage 把名字“骗”给它
        const urlParams = new URLSearchParams(window.location.search);
        const teacherName = urlParams.get('name');
        if (teacherName) {
            localStorage.setItem('gameDeckPlayerName', teacherName);
            console.log("已将 URL 名字注入 localStorage，等待 Unity 读取...");
        }
    </script>

    <script>
        // 🚨 新增：页面加载时，立刻从网址里提取房间号并显示出来
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomCode = urlParams.get('roomCode'); // 从网址中抓取 roomCode

            const codeSpan = document.getElementById('codeValue');
            if (roomCode) {
                codeSpan.textContent = roomCode; // 抓到了就显示
            } else {

                const savedCode = localStorage.getItem('gameDeckRoomCode');
                codeSpan.textContent = savedCode ? savedCode : "N/A";
            }
            const role = urlParams.get('role'); // 从网址抓取 'teacher' 或 'student'
            const roleSpan = document.getElementById('roleValue');
            if (role) {
                roleSpan.textContent = role.charAt(0).toUpperCase() + role.slice(1);
            } else {
                const savedRole = localStorage.getItem('gameDeckRole');
                roleSpan.textContent = savedRole ? (savedRole.charAt(0).toUpperCase() + savedRole.slice(1)) : "Guest";
            }
        });

        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/WebGL.data",
            frameworkUrl: buildUrl + "/WebGL.framework.js",
            codeUrl: buildUrl + "/WebGL.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "GameDeckFoundary",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "1280px";
            canvas.style.height = "720px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    unityInstance.SetFullscreen(1);
                };

                const urlParams = new URLSearchParams(window.location.search);
                const teacherName = urlParams.get('name'); // 对应你网址里的 name 参数

                if (teacherName) {
                    console.log("🚀 正在强行推送真名到 Unity (GameManager):", teacherName);

                    unityInstance.SendMessage('GameManager', 'SetPlayerName', teacherName);
                }

                console.log("✅ 游戏加载完毕！Unity 已收到指令。");

            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);

    </script>
</body>

</html>
