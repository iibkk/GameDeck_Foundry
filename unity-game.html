<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | GameDeckFoundary</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #231f20;
        }

        #unity-container,
        #unity-canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="roomCodeDisplay" style="
        position: absolute; 
        top: 20px; 
        left: 20px; 
        z-index: 1000; 
        background-color: rgba(0, 0, 0, 0.8); 
        color: #00ff00; 
        padding: 10px 20px; 
        font-family: Arial, sans-serif; 
        font-size: 24px; 
        font-weight: bold; 
        border-radius: 8px; 
        border: 2px solid #00ff00;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    ">
        Room Code: <span id="codeValue">Loading...</span>
    </div>

    <div id="roleDisplay" style="
        position: absolute; 
        top: 20px; 
        right: 20px;
        z-index: 1000; 
        background-color: rgba(0, 0, 0, 0.8); 
        color: #ff9900;
        padding: 10px 20px; 
        font-family: Arial, sans-serif; 
        font-size: 24px; 
        font-weight: bold; 
        border-radius: 8px; 
        border: 2px solid #ff9900;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    ">
        Role: <span id="roleValue">Loading...</span>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);

            const roomCode = urlParams.get('roomCode');
            const codeSpan = document.getElementById('codeValue');
            codeSpan.textContent = roomCode ? roomCode : (localStorage.getItem('gameDeckRoomCode') || "N/A");

            const role = urlParams.get('role');
            const roleSpan = document.getElementById('roleValue');
            const finalRole = role ? role : localStorage.getItem('gameDeckRole');
            roleSpan.textContent = finalRole ? (finalRole.charAt(0).toUpperCase() + finalRole.slice(1)) : "Guest";

            const teacherName = urlParams.get('name');
            if (teacherName) {
                localStorage.setItem('gameDeckPlayerName', teacherName);
            }
        });

        var canvas = document.querySelector("#unity-canvas");
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/WebGL.data",
            frameworkUrl: buildUrl + "/WebGL.framework.js",
            codeUrl: buildUrl + "/WebGL.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "GameDeckFoundary",
            productVersion: "1.0",
            showBanner: function (msg, type) { }
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "1280px";
            canvas.style.height = "720px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";


                const urlParams = new URLSearchParams(window.location.search);
                const teacherName = urlParams.get('name');
                if (teacherName) {
                    try { unityInstance.SendMessage('GameManager', 'SetPlayerName', teacherName); } catch (e) { }
                }

                const role = localStorage.getItem('gameDeckRole');
                const roomCode = localStorage.getItem('gameDeckRoomCode');
                const sessionId = localStorage.getItem('gameDeckSessionId');
                const studentId = localStorage.getItem('gameDeckStudentId') || "";

                if (role) {
                    const payload = JSON.stringify({
                        role: role,
                        roomCode: roomCode,
                        sessionId: sessionId,
                        studentId: studentId
                    });
                    console.log("send data to Unity: ", payload);
                    try { unityInstance.SendMessage('APIManager', 'ReceiveGameData', payload); } catch (e) { }
                }

            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>

</html>
