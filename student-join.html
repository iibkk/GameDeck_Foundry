<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Join Game - Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        /* 给你配一套和 Teacher Dashboard 风格一致的酷炫暗黑风 UI */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #231f20;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .join-container {
            background-color: #2d2a2b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #444;
        }

        h2 {
            margin-bottom: 30px;
            color: #00ff00;
            /* 绿色代表开始游戏 */
        }

        h2 i {
            font-size: 32px;
            vertical-align: middle;
            margin-right: 10px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            background-color: #1a1819;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff00;
        }

        .join-btn {
            width: 100%;
            padding: 14px;
            background-color: #00ff00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .join-btn:hover {
            background-color: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>

<body>

    <div class="join-container">
        <h2><i class='bx bx-game'></i> Join Game Deck</h2>

        <div class="input-group">
            <label for="playerName"><i class='bx bx-user'></i> Your Name (你的名字)</label>
            <input type="text" id="playerName" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
            <label for="roomCode"><i class='bx bx-key'></i> Room Code (房间号)</label>
            <input type="text" id="roomCode" placeholder="Enter 6-digit code" maxlength="6"
                style="text-transform: uppercase;" required>
        </div>

        <button class="join-btn" id="joinGameBtn">Enter Game (加入游戏)</button>
    </div>

    <script src="student-join.js"></script>
</body>

</html>
